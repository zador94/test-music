org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# Windows + Kotlin 2.0.21 + JBR 21: отдельный Kotlin compile daemon иногда
# печатает "kotlin compile daemon is ready" и сразу выходит с кодом 0.
# Android Studio тогда помечает файл, который компилировался в этот момент
# (часто StemSplitWorker.kt), хотя ошибки типа там нет.
# in-process = kotlinc внутри JVM Gradle, без второго процесса.
# Куча увеличена выше, потому что компилятор теперь живёт в Gradle-демоне.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
# KSP incremental cache в AgentStores часто ломается (file-to-id.tab_i).
ksp.incremental=false
